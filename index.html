<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>築塔 STUDIO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo-container">
                    <img src="logo.jpg" alt="築塔 STUDIO" class="logo-image">
                    <h1 class="logo-text">築塔 STUDIO</h1>
                </div>

                <!-- 漢堡選單按鈕 (僅手機版顯示) -->
                <button class="hamburger-menu" id="hamburgerBtn" aria-label="開啟選單">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>

                <!-- 導航選單 -->
                <div class="nav-menu-wrapper" id="navMenuWrapper">
                    <ul class="nav-menu">
                        <li class="nav-item nav-dropdown">
                            <a href="#" class="nav-link dropdown-toggle">取貨日期</a>
                            <ul class="dropdown-menu" id="navDateMenu">
                                <li class="dropdown-item loading">載入中...</li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="#order" class="nav-link">訂購資訊</a>
                        </li>
                        <li class="nav-item">
                            <a href="#about" class="nav-link">關於我們</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <section id="products" class="products-section">
            <div class="container">
                <div class="date-selector">
                    <label for="dateSelect">選擇日期：</label>
                    <input type="date" id="dateSelect" onchange="onDateSelectChange()">
                </div>
                <div id="productsContainer" class="products-grid">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </section>

        <section id="order" class="order-section">
            <div class="container">
                <h2>訂購資訊</h2>
                <div class="order-form-container">
                    <form id="orderForm" class="order-form">
                        <div class="form-group">
                            <label for="customerName">姓名 *</label>
                            <input type="text" id="customerName" name="customerName" required>
                        </div>
                        <div class="form-group">
                            <label for="customerPhone">電話 *</label>
                            <input type="tel" id="customerPhone" name="customerPhone" required>
                        </div>
                        <div class="form-group">
                            <label for="customerInstagram">IG帳號 *</label>
                            <input type="text" id="customerInstagram" name="customerInstagram" placeholder="請輸入Instagram帳號 (不需要@)" required>
                        </div>
                        <div class="form-group">
                            <label for="pickupDate">取貨日期 * <small>(右上角選單選擇)</small></label>
                            <input type="date" id="pickupDate" name="pickupDate" required readonly disabled onchange="updateDeliveryOptions()">
                        </div>
                        <div class="form-group">
                            <label for="paymentMethod">付款方式 *</label>
                            <select id="paymentMethod" name="paymentMethod" required>
                                <option value="">請選擇付款方式</option>
                                <option value="現金">現金</option>
                                <option value="LinePay">LinePay</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="deliveryMethod">取貨方式 *</label>
                            <select id="deliveryMethod" name="deliveryMethod" required>
                                <option value="">請先選擇取貨日期</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>配送地址</label>
                            <div class="address-selectors">
                                <select id="citySelect" name="city" required onchange="updateDistricts()">
                                    <option value="">請選擇縣市</option>
                                </select>
                                <select id="districtSelect" name="district" required disabled>
                                    <option value="">請先選擇縣市</option>
                                </select>
                            </div>
                            <input type="text" id="detailAddress" name="detailAddress" placeholder="請輸入詳細地址（包含社區名、公司名等）" required class="detail-address">
                        </div>
                        <div class="form-group">
                            <label>訂購項目</label>
                            <div id="orderItems" class="order-items">
                                <!-- 訂購項目將由 JavaScript 動態生成 -->
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="specialRequests">包裝需求 <small>(Ex: 四顆盒裝 or 單入裝)</small></label>
                            <textarea id="specialRequests" name="specialRequests" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <div class="total-amount">
                                <strong>總金額：NT$ <span id="totalAmount">0</span></strong>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="terms-agreement">
                                <div class="terms-wrapper">
                                    <label for="termsAgreement" class="terms-text">
                                        <input type="checkbox" id="termsAgreement" name="termsAgreement" required>
                                        <span class="terms-content">
                                            我已了解，填完表單後需 IG 私訊
                                            <a href="https://www.instagram.com/buildtart.studio/" target="_blank" class="ig-link" id="igLink">@buildtart.studio</a>，
                                            由築塔 STUDIO回覆確認後訂單才成立。若為面交，<span class="warning-text">遲到將視為棄單</span>；若為外送，
                                            明白無法指定送達時間，並會留意 IG 私訊，<span class="warning-text">準時待在配送地址收件</span>。
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="submit-button">提交訂單</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="about" class="about-section">
            <div class="container">
                <h2>關於我們</h2>
                <div class="about-content">
                    <p>一層一層堆疊，像在築甜點的風景。</p>
                    <p>不誇張、不浮躁，專注手工與細節。</p>
                    <p>每顆塔，都是靜靜完成的溫柔作品。</p>
                    <p class="registration-info">食品業者登錄字號O-202305357-00000-8</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="currentYear"></span> 築塔 STUDIO. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.instagram.com/buildtart.studio/" target="_blank" class="social-link" title="Instagram">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <!-- 浮動購物車按鈕 -->
    <div id="floatingCart" class="floating-cart" onclick="scrollToOrder()">
        <div class="cart-icon">🛒</div>
        <div class="cart-badge" id="cartBadge">0</div>
    </div>

    <script src="hybrid-script.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1DVFVDLWV"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T1DVFVDLWV');
    </script>
</body>
</html>
