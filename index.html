<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildTart 築塔</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo-container">
                    <img src="logo.jpg" alt="BuildTart 築塔" class="logo-image">
                    <h1 class="logo-text">BuildTart 築塔</h1>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="#products" class="nav-link">今日甜點</a>
                    </li>
                    <li class="nav-item">
                        <a href="#order" class="nav-link">線上訂購</a>
                    </li>
                    <li class="nav-item">
                        <a href="#about" class="nav-link">關於我們</a>
                    </li>
                    <li class="nav-item social-link">
                        <a href="https://www.instagram.com/buildtart.studio/" target="_blank" class="nav-link instagram-link" title="Instagram">
                            <svg class="instagram-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>每日手作甜點</h2>
                <p>精選當日新鮮製作的美味甜點</p>
                <button class="cta-button" onclick="scrollToProducts()">查看今日甜點</button>
            </div>
        </section>

        <section id="products" class="products-section">
            <div class="container">
                <h2>今日甜點</h2>
                <div class="date-selector">
                    <label for="dateSelect">選擇日期：</label>
                    <input type="date" id="dateSelect" onchange="loadProducts()">
                </div>
                <div id="productsContainer" class="products-grid">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </section>

        <section id="order" class="order-section">
            <div class="container">
                <h2>線上訂購</h2>
                <div class="order-form-container">
                    <form id="orderForm" class="order-form">
                        <div class="form-group">
                            <label for="customerName">姓名 *</label>
                            <input type="text" id="customerName" name="customerName" required>
                        </div>
                        <div class="form-group">
                            <label for="customerPhone">電話 *</label>
                            <input type="tel" id="customerPhone" name="customerPhone" required>
                        </div>
                        <div class="form-group">
                            <label for="customerEmail">Email</label>
                            <input type="email" id="customerEmail" name="customerEmail">
                        </div>
                        <div class="form-group">
                            <label for="pickupDate">取貨日期 *</label>
                            <input type="date" id="pickupDate" name="pickupDate" required>
                        </div>
                        <div class="form-group">
                            <label for="pickupTime">取貨時間 *</label>
                            <select id="pickupTime" name="pickupTime" required>
                                <option value="">請選擇時間</option>
                                <option value="09:00">09:00</option>
                                <option value="10:00">10:00</option>
                                <option value="11:00">11:00</option>
                                <option value="12:00">12:00</option>
                                <option value="13:00">13:00</option>
                                <option value="14:00">14:00</option>
                                <option value="15:00">15:00</option>
                                <option value="16:00">16:00</option>
                                <option value="17:00">17:00</option>
                                <option value="18:00">18:00</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>訂購項目</label>
                            <div id="orderItems" class="order-items">
                                <!-- 訂購項目將由 JavaScript 動態生成 -->
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="specialRequests">特殊需求</label>
                            <textarea id="specialRequests" name="specialRequests" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <div class="total-amount">
                                <strong>總金額：NT$ <span id="totalAmount">0</span></strong>
                            </div>
                        </div>
                        <button type="submit" class="submit-button">提交訂單</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="about" class="about-section">
            <div class="container">
                <h2>關於我們</h2>
                <div class="about-content">
                    <p>BuildTart 築塔致力於提供最新鮮、最美味的手作甜點。我們每天精心製作各種蛋糕和甜品，讓您享受最純粹的甜蜜時光。</p>
                    <p>我們堅持使用優質食材，並採用傳統工藝製作每一份甜點，確保每一口都是完美的味覺體驗。</p>
                    <p>食品業者登錄字號O-202305357-00000-8</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="currentYear"></span> BuildTart 築塔. All rights reserved.</p>
        </div>
    </footer>

    <script src="hybrid-script.js"></script>
</body>
</html>
