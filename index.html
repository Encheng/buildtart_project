<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>築塔 STUDIO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo-container">
                    <img src="logo.jpg" alt="築塔 STUDIO" class="logo-image">
                    <h1 class="logo-text">築塔 STUDIO</h1>
                </div>

                <!-- 漢堡選單按鈕 (僅手機版顯示) -->
                <button class="hamburger-menu" id="hamburgerBtn" aria-label="開啟選單">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>

                <!-- 導航選單 -->
                <div class="nav-menu-wrapper" id="navMenuWrapper">
                    <ul class="nav-menu">
                        <li class="nav-item">
                            <a href="#products" class="nav-link">今日甜點</a>
                        </li>
                        <li class="nav-item nav-dropdown">
                            <a href="#" class="nav-link dropdown-toggle">甜點開單日</a>
                            <ul class="dropdown-menu" id="navDateMenu">
                                <li class="dropdown-item loading">載入中...</li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a href="#order" class="nav-link">線上訂購</a>
                        </li>
                        <li class="nav-item">
                            <a href="#about" class="nav-link">關於我們</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>每日手作甜點</h2>
                <p>精選當日新鮮製作的美味甜點</p>
                <button class="cta-button" onclick="scrollToProducts()">查看今日甜點</button>
            </div>
        </section>

        <section id="products" class="products-section">
            <div class="container">
                <h2>今日甜點</h2>
                <div class="date-selector">
                    <label for="dateSelect">選擇日期：</label>
                    <input type="date" id="dateSelect" onchange="onDateSelectChange()">
                </div>
                <div id="productsContainer" class="products-grid">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </section>

        <section id="order" class="order-section">
            <div class="container">
                <h2>線上訂購</h2>
                <div class="order-form-container">
                    <form id="orderForm" class="order-form">
                        <div class="form-group">
                            <label for="customerName">姓名 *</label>
                            <input type="text" id="customerName" name="customerName" required>
                        </div>
                        <div class="form-group">
                            <label for="customerPhone">電話 *</label>
                            <input type="tel" id="customerPhone" name="customerPhone" required>
                        </div>
                        <div class="form-group">
                            <label for="customerInstagram">IG帳號 *</label>
                            <input type="text" id="customerInstagram" name="customerInstagram" placeholder="請輸入Instagram帳號 (不需要@)" required>
                        </div>
                        <div class="form-group">
                            <label for="pickupDate">取貨日期 * <small>(自動帶入甜點的選擇日期)</small></label>
                            <input type="date" id="pickupDate" name="pickupDate" required readonly onchange="updateDeliveryOptions()">
                        </div>
                        <div class="form-group">
                            <label for="deliveryMethod">交易方式 *</label>
                            <select id="deliveryMethod" name="deliveryMethod" required>
                                <option value="">請先選擇取貨日期</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>配送地址</label>
                            <div class="address-selectors">
                                <select id="citySelect" name="city" required onchange="updateDistricts()">
                                    <option value="">請選擇縣市</option>
                                </select>
                                <select id="districtSelect" name="district" required disabled>
                                    <option value="">請先選擇縣市</option>
                                </select>
                            </div>
                            <input type="text" id="detailAddress" name="detailAddress" placeholder="請輸入詳細地址（路段、巷弄、門牌號碼等）" required class="detail-address">
                        </div>
                        <div class="form-group">
                            <label>訂購項目</label>
                            <div id="orderItems" class="order-items">
                                <!-- 訂購項目將由 JavaScript 動態生成 -->
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="specialRequests">特殊需求</label>
                            <textarea id="specialRequests" name="specialRequests" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <div class="total-amount">
                                <strong>總金額：NT$ <span id="totalAmount">0</span></strong>
                            </div>
                        </div>
                        <button type="submit" class="submit-button">提交訂單</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="about" class="about-section">
            <div class="container">
                <h2>關於我們</h2>
                <div class="about-content">
                    <p>一層一層堆疊，像在築甜點的風景。</p>
                    <p>不誇張、不浮躁，專注手工與細節。</p>
                    <p>每顆塔，都是靜靜完成的溫柔作品。</p>
                    <p class="registration-info">食品業者登錄字號O-202305357-00000-8</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="currentYear"></span> 築塔 STUDIO. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.instagram.com/buildtart.studio/" target="_blank" class="social-link" title="Instagram">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="hybrid-script.js"></script>
</body>
</html>
